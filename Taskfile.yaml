# https://taskfile.dev

version: '3'

vars:
  ALL_GO_FILES: ./...

env:
  MODULE_PATH: github.com/barnowlsnest/go-configlib/v2

tasks:
  go-mod:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  go-build:
    desc: Build all packages
    cmds:
      - go build '{{.ALL_GO_FILES}}'

  go-fmt:
    desc: Format all Go files
    cmds:
      - go fmt '{{.ALL_GO_FILES}}'

  go-vet:
    desc: Run static analysis
    cmds:
      - go vet '{{.ALL_GO_FILES}}'

  go-test:
    desc: Run all tests with coverage and benchmarks
    cmds:
      - go test -cover '{{.ALL_GO_FILES}}'
      - go test -bench=. '{{.ALL_GO_FILES}}'

  go-lint:
    desc: Run golangci-lint (with --fix)
    cmds:
      - golangci-lint run --fix

  sanity:
    desc: Run all checks in order (mod, fmt, lint, build, vet, test)
    cmds:
      - task: go-mod
      - task: go-fmt
      - task: go-lint
      - task: go-build
      - task: go-vet
      - task: go-test
